<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#070402}
body{display:flex;align-items:center;justify-content:center;font-family:"Microsoft YaHei","PingFang SC",sans-serif}
.card{width:1080px;height:1620px;overflow:hidden;position:relative;color:#EDE0C2;
  background:radial-gradient(ellipse 80% 55% at 50% 40%,#241A0C 0%,#120C05 60%,#070402 100%)}
@media (max-width:1180px){.card{zoom:.62}}
@media (max-width:760px){.card{zoom:.4}}
.grain{position:absolute;inset:0;opacity:.08;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
.frame{position:absolute;inset:40px;border:1px solid rgba(201,169,97,.34)}
.frame:before{content:"";position:absolute;inset:7px;border:1px solid rgba(201,169,97,.16)}
.wrap{position:absolute;inset:40px;padding:42px 62px 38px;display:flex;flex-direction:column;
  justify-content:space-between}
.hd{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.38em;
  color:rgba(201,169,97,.75);font-family:Georgia,serif}
.hd b{font-weight:400;color:#D9B96A}
.dialwrap{position:relative;height:744px}
.title{text-align:center}
.title h1{font-family:"SimSun","Songti SC",serif;font-size:60px;font-weight:400;letter-spacing:.2em;
  background:linear-gradient(180deg,#FCF3D3,#D9B96A 58%,#9A7428);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.title .k{margin-top:12px;font-size:14px;letter-spacing:.76em;color:rgba(217,185,106,.7)}
.quote{display:flex;align-items:center;gap:22px}
.quote i{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(201,169,97,.5),transparent)}
.quote p{font-family:"KaiTi","STKaiti",serif;font-size:27px;line-height:1.75;letter-spacing:.06em;
  color:#EFE3C2;text-align:center;max-width:700px}
.clabel{text-align:center;font-size:11px;letter-spacing:.5em;color:rgba(201,169,97,.55);
  margin-bottom:2px;font-family:Georgia,serif}
.bandwrap{text-align:center}
.bandcap{margin-top:12px;font-size:10.5px;letter-spacing:.42em;color:rgba(201,169,97,.45)}
.ft{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.3em;
  color:rgba(201,169,97,.55);font-family:Georgia,serif}
</style></head><body>
